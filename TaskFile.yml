# Taskfile for automating the DDAS Vroegsignalering deployment process
#
# This Taskfile defines tasks for:
# - Validating required tools and variables
# - Importing an XMI file into Crunch UML and transforming it naar een informatiemodel en uitwisselmodel
# - Generating a JSON Schema from the uitwisselmodel
# - Generating Markdown documentation from the informatiemodel
# - Building and validating the MkDocs site
# - Publishing documentation locally (Mike), to test, and to GitHub Pages
#
# Usage:
# - Run `task` to execute the default task (full-deploy)
# - Run `task --list` to see all available tasks
# - Run `task <taskname>` to execute a specific task
#
# Environment:
# - A `.env` file is used to load configuration variables like VERSION, XMI_FILE, etc.
# - Ensure required tools are installed before running (`task prepare:check-tools`).
#
# Examples:
# - To check preconditions: `task prepare:check-tools && task prepare:check-vars`
# - To import the XMI file and transform the model: `task import:model`
# - To generate the JSON schema: `task generate:json-schema`
# - To generate the documentation: `task generate:docs`
# - To validate the MkDocs site: `task build:validate`
# - To preview the site locally: `task build:serve`
# - To deploy the documentation locally with Mike: `task publish:local`
# - To publish the documentation to GitHub Pages: `task publish:github`
# - To perform the entire deployment sequence: `task full-deploy`
#
# Author: Arjen Brienen
# Last Updated: 28 april 2026
version: '3'

# Default task wordt uitgevoerd bij 'task' zonder argument
silent: true
default: full-deploy

dotenv: ['.env']

vars:
  VERSION_DIR: "./{{.VERSION}}"
  XMI: "data/{{.XMI_FILE}}"
  CRUNCH_UML_DB: "./crunch_uml.db"
  DOCS: "./docs"
  DEFS: "./docs/definities"
  JSON: "{{.VERSION_DIR}}/{{.JSON_SCHEMA}}"
  JSON_SCHEMA_FILE: "{{.VERSION_DIR}}/json_schema_Uitwisselmodel.json"

tasks:
  # ==========================================================================
  # Prepare — Voorwaarden valideren
  # ==========================================================================
  prepare:check-tools:
    desc: "Check for pre conditions. Verify required tools are installed."
    cmds:
      - |
        # Lijst van vereiste tools en hun download-URLs
        declare -A tools=(
          ["crunch_uml"]="https://github.com/brienen/crunch_uml"
          ["mkdocs"]="https://www.mkdocs.org"
          ["mike"]="https://github.com/jimporter/mike"
          ["jq"]="https://stedolan.github.io/jq"
          ["node"]="https://nodejs.org"
          ["ajv"]="https://ajv.js.org"
          ["python3"]="https://www.python.org"
        )

        # Controleer of tools geïnstalleerd zijn
        missing_tools=()
        for tool in "${!tools[@]}"; do
          if ! command -v $tool &> /dev/null; then
            missing_tools+=($tool)
          fi
        done

        # Meld ontbrekende tools en geef installatie-instructies
        if [ ${#missing_tools[@]} -ne 0 ]; then
          echo "Error: The following tools are not installed:"
          for tool in "${missing_tools[@]}"; do
            echo "- $tool: ${tools[$tool]}"
          done
          echo "Please install the missing tools and try again."
          exit 1
        else
          echo "All required tools are installed."
        fi
    shell: bash

  prepare:check-vars:
    desc: "Check for pre conditions. Validate required variables VERSION and check if VERSION_DIR exist."
    cmds:
      - |
        # Valideer invoerparameters
        echo "Validating input parameter {{.VERSION}} ..."
      - |
        if [ -z "{{.VERSION}}" ]; then
          echo "Error: VERSION cannot be empty."
          exit 1
        fi
        if [[ ! "{{.VERSION}}" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)*(-draft)?$ ]]; then
          echo "Error: Invalid VERSION format. Use v{number}.{number} or v{number}.{number}-draft, e.g., v1.0"
          exit 1
        fi
        if [ ! -d "{{.VERSION_DIR}}" ]; then
          echo "Error: Directory '{{.VERSION_DIR}}' does not exist."
          exit 1
        fi
      - |
        # Valideer invoerparameters
        echo "VERSION {{.VERSION}} and Versiondir {{.VERSION_DIR}} are valid..."
    shell: bash

  # ==========================================================================
  # Import — Model(len) inladen in Crunch UML
  # ==========================================================================
  import:model:
    desc: "Import the XMI file into Crunch UML Database."
    deps: [prepare:check-tools, prepare:check-vars]
    cmds:
      - |
        if [ ! -f "{{.XMI}}" ]; then
          echo "Error: XMI file '{{.XMI}}' does not exist."
          exit 1
        fi
      - echo "Importing XMI file '{{.XMI}}' into Crunch UML..."
      - crunch_uml import -f "{{.XMI}}" -t eaxmi -db_create
      - echo "Extracting and tranforming vroegsignalering datamodel..."
      - crunch_uml transform -ttp plugin -sch_to {{.IM_SCHEMA_VROEGSIGNALERING}} -rt_pkg "{{.ROOT_IM_VROEGSIGNALERING}}" --plugin_class_name {{.IM_TRANSFORMER_CLASS_VROEGSIGNALERING}} --plugin_file_name {{.IM_TRANSFORMER_VROEGSIGNALERING}}
      - echo "Extracting and tranforming vroegsignalering uitwisselmodel..."
      - crunch_uml transform -ttp plugin -sch_from {{.IM_SCHEMA_VROEGSIGNALERING}} -sch_to {{.UM_SCHEMA_VROEGSIGNALERING}} -rt_pkg "{{.ROOT_IM_VROEGSIGNALERING}}" --plugin_class_name {{.UM_TRANSFORMER_VROEGSIGNALERING_CLASS}} --plugin_file_name {{.UM_TRANSFORMER_VROEGSIGNALERING}}
      - echo "Crunch database successfully created and setup..."
    shell: bash
    sources:
      - "{{.XMI}}"
      - "{{.IM_TRANSFORMER_VROEGSIGNALERING}}"
      - "{{.UM_TRANSFORMER_VROEGSIGNALERING}}"
    generates:
      - "{{.CRUNCH_UML_DB}}"
    run: when_changed

  # ==========================================================================
  # Generate — Artifacts genereren uit het model
  # ==========================================================================
  generate:json-schema:
    desc: "Generate JSON Schema from uitwisselmodel {{.UM_SCHEMA_VROEGSIGNALERING}}...'"
    deps: [import:model]
    cmds:
      - echo "Generate JSON Schema '{{.JSON}}' from schema '{{.UM_SCHEMA_VROEGSIGNALERING}}' using root class '{{.ROOT_CLASS_UM_VROEGSIGNALERING}}'..."
      - crunch_uml  -sch {{.UM_SCHEMA_VROEGSIGNALERING}} -d export -t json_schema --output_class_id {{.ROOT_CLASS_UM_VROEGSIGNALERING}} -js_url {{.VROEGSIGNALERING_JSON_SCHEMA_URL}} -f {{.JSON}}
      - python3 tools/postprocess_json_schema.py "{{.JSON_SCHEMA_FILE}}"
      - |
        # Crunch UML zet rolnamen in de 'required'-lijst om naar kleine letters
        # (getVerplichteAttributen in crunch_uml/renderers/jinja2renderer.py). Daardoor komt
        # 'aanleverendeOrganisatie' als 'aanleverendeorganisatie' in het schema en matcht die
        # nooit met de gelijknamige property. Zolang dat niet in crunch_uml is opgelost,
        # herstellen we de schrijfwijze hier.
        python3 - "{{.JSON_SCHEMA_FILE}}" <<'PYEOF'
        import sys
        from pathlib import Path

        FOUT = '"aanleverendeorganisatie"'
        GOED = '"aanleverendeOrganisatie"'

        pad = Path(sys.argv[1])
        tekst = pad.read_text(encoding="utf-8")
        aantal = tekst.count(FOUT)
        if aantal:
            pad.write_text(tekst.replace(FOUT, GOED), encoding="utf-8")
        print(f"Rolnaam in required-lijst hersteld: {aantal}x 'aanleverendeorganisatie' -> 'aanleverendeOrganisatie'.")
        PYEOF
    shell: bash

  generate:docs:
    desc: "Generate Markdown documentation from the model."
    deps: [import:model]
    cmds:
      - echo "Generating Markdown documentation..."
      - mkdir -p "{{.DEFS}}"
      - rm -rf "{{.DEFS}}"/*.md
      - crunch_uml -sch {{.IM_SCHEMA_VROEGSIGNALERING}} export -t jinja2 --output_jinja2_template ddas_markdown.j2 -f "{{.DEFS}}/{{.MD}}" --output_jinja2_templatedir ./tools/
      - echo "Generating uitleg documentation using jinja template..."
      - crunch_uml -sch {{.IM_SCHEMA_VROEGSIGNALERING}} export -t jinja2 --output_jinja2_template uitleg.j2 -f "{{.DOCS}}/{{.UITLEG}}" --output_jinja2_templatedir ./tools/
      - |
        # Vervang de versies in de uitwisselspecificatie-templates
        # Loop door alle .template-bestanden in de directory en submappen
        echo "Processing template files in {{.DOCS}} ..."
        for file in $(find "{{.DOCS}}" -type f -name "*.template"); do
          # Bepaal de doelbestandnaam door ".template" te verwijderen
          output_file="${file%.template}"

          # Gebruik sed om de placeholder ###VERSION### te vervangen door de versie
          sed "s/###VERSION###/{{.VERSION}}/g" "$file" > "$output_file"

          # Geef een bericht over de verwerking
          echo "Processed $file -> $output_file"
        done
    shell: bash

  # ==========================================================================
  # Build — MkDocs site bouwen en valideren
  # ==========================================================================
  build:validate:
    desc: "Build the MkDocs documentation in strict mode to check for errors."
    deps: [generate:docs, generate:json-schema]
    cmds:
      - echo "Validating MkDocs documentation..."
      - |
        mkdocs_python="$(head -n 1 "$(command -v mkdocs)" | sed 's/^#!//')"
        "$mkdocs_python" -W ignore::DeprecationWarning -W "ignore:pkg_resources is deprecated as an API:UserWarning" -m mkdocs build --strict --site-dir /tmp/ddas-vroegsignalering-site
      - echo "Documentation validation passed."
      - node tools/validate_json_examples.js "{{.JSON_SCHEMA_FILE}}" "{{.VERSION_DIR}}"
      - echo "JSON example validation passed."
    shell: bash

  build:site:
    desc: "Build the MkDocs site."
    deps: [generate:docs]
    cmds:
      - echo "Building MkDocs site..."
      - mkdocs build --clean
      - echo "Site built successfully."
    shell: bash

  build:serve:
    desc: "Start the local MkDocs development server (snelle preview, genereert geen docs vooraf — draai zo nodig eerst 'task generate:docs')."
    cmds:
      - echo "Starting MkDocs development server..."
      - mkdocs serve
    shell: bash

  # ==========================================================================
  # Publish — Documentatie publiceren
  # ==========================================================================
  publish:local:
    desc: "Build and deploy the documentation locally; a -draft VERSION is kept separate from latest."
    deps: [generate:docs]
    cmds:
      - echo "Building and deploying MkDocs and Mike..."
      - mkdocs build --clean
      - |
        if [[ "{{.VERSION}}" == *-draft ]]; then
          mike deploy "{{.VERSION}}"
        else
          mike deploy "{{.VERSION}}" latest --update-aliases
          mike set-default "{{.VERSION}}"
        fi
      - echo "Documentation deployed. Use 'mike serve' to view results..."
    shell: bash

  publish:draft:delete:
    desc: "Remove the current public documentation draft from GitHub Pages."
    prompt:
      - "Dit verwijdert draft '{{.VERSION}}' van GitHub Pages. Doorgaan?"
      - "Weet je het zeker?"
    cmds:
      - |
        if [[ "{{.VERSION}}" != *-draft ]]; then
          echo "Error: VERSION must end with '-draft' to delete a draft."
          exit 1
        fi
        mike delete "{{.VERSION}}" --push
      - echo "Draft '{{.VERSION}}' verwijderd van GitHub Pages."
    shell: bash

  publish:github:
    desc: "Publish the documentation directly to GitHub Pages."
    deps: [publish:local]
    prompt:
     - Dit commando publiceert de documentatie direct naar de LIVE GitHub pages. Doorgaan?
     - Weet je het zeker?
    cmds:
      - echo 'Deploying to GitHub Pages...'
      - git push origin gh-pages

  publish:test:
    desc: "Publish the documentation to test location on host {{.FTP_HOST}}"
    deps: [publish:local]
    cmds:
      - echo 'Deploying to test location...'
      - lftp -e "set ssl:verify-certificate no; cd {{.FTP_REMOTE_DIR}}; mirror -R --delete --verbose ./{{.FTP_LOCAL_DIR}} .; bye" {{.FTP_HOST}}

  # ==========================================================================
  # Orchestratie
  # ==========================================================================
  full-deploy:
    desc: "Execute the entire deployment process: json-schema, and documentation"
    cmds:
      - task: publish:local
      - echo "Documentation deployment completed."
      - task: generate:json-schema
      - echo "JSON-schema generation completed."
      - echo "Full deployment completed."
    shell: bash
